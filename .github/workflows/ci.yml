name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  film:
    name: Film composition
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install film dependencies
        run: python -m pip install -r launch/2026-09-redesign/requirements.txt
      - name: Verify every animation frame and regression probes
        run: python launch/2026-09-redesign/verify.py
      - name: Preserve film evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: film-composition
          path: output/film-verification
          retention-days: 7

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Scan committed history
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

  verify:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - "24.x"
          - "26.x"
    steps:
      - name: Check out
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install browser test runtime
        run: npx playwright install --with-deps chromium
      - name: Run verification
        run: npm run verify
      - name: Validate example snapshot
        run: npm run validate:snapshot -- docs/world-snapshot.example.json
      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-evidence-node-${{ matrix.node-version }}
          path: |
            output/playwright/results
            output/playwright/report
          retention-days: 7
